plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdfnative'
version = '1.0.0'

android {
  namespace "expo.modules.pdfnative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // pdfium: page and region rendering, text with character boxes, links, the outline, passwords
  // (PdfRenderer has none of the last four). Since §18 W18 this is the app's only copy of
  // pdfium's native library (react-native-pdf-jsi, which used to bring the same version, is gone).
  implementation 'io.legere:pdfiumandroid:1.0.32'
}
